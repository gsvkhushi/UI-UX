<html>
    <head></head>
    <body>
        <h2> Image Slider</h2>
        <img id = "image" src = "image1.jpg" >
        <br> <br>
        <button onclick="previous()">Previous</button>s
        <button onclick="next()">Next</button>
        <script>
            let images = ["image1.jpg", "image2.jpg", "image3.jpg"];
            let i = 0;
            function next() {
                i++;
                if (i >= images.length) {
                    i = 0;
                }
                document.getElementById("image").src = images[i];
            }
            function previous() {
                i--;
                if (i < 0) {
                    i = images.length - 1;
                }
                document.getElementById("image").src = images[i];
          
            }
            setInterval(next, 3000);
        </script>
    </body>
</html>
